<div class="flex h-screen flex-col bg-neutral-900 text-neutral-200">
  <!-- Title bar -->
  <header
    class="flex h-9 shrink-0 items-center gap-2 border-b border-neutral-800 bg-neutral-950 px-3 text-sm font-medium"
  >
    <ng-icon name="lucideCode" class="text-sky-400" size="18" />
    <span>CodeCanvas AI</span>
    <span class="ml-auto text-xs text-neutral-500">Fase 1 — Fundaciones</span>
  </header>

  <!-- Main row: left | center | right -->
  <div class="flex min-h-0 flex-1">
    <aside
      class="flex shrink-0 flex-col overflow-hidden border-r border-neutral-800 bg-neutral-900"
      [style.width.px]="leftWidth()"
    >
      <div class="flex items-center gap-2 border-b border-neutral-800 px-3 py-2 text-xs uppercase tracking-wide text-neutral-400">
        <ng-icon name="lucideFolderTree" size="16" />
        Explorador
      </div>
      <div class="flex-1 p-3 text-sm text-neutral-500">Sin proyecto abierto</div>
    </aside>

    <div
      class="w-1 shrink-0 cursor-col-resize bg-neutral-800 hover:bg-sky-500"
      (pointerdown)="startResize('left', $event)"
    ></div>

    <main class="flex min-w-0 flex-1 flex-col bg-neutral-950">
      <div class="flex items-center gap-2 border-b border-neutral-800 px-3 py-2 text-xs uppercase tracking-wide text-neutral-400">
        <ng-icon name="lucideMonitor" size="16" />
        Editor / Preview
      </div>
      <div class="flex flex-1 items-center justify-center text-sm text-neutral-600">
        Area central
      </div>
    </main>

    <div
      class="w-1 shrink-0 cursor-col-resize bg-neutral-800 hover:bg-sky-500"
      (pointerdown)="startResize('right', $event)"
    ></div>

    <aside
      class="flex shrink-0 flex-col overflow-hidden border-l border-neutral-800 bg-neutral-900"
      [style.width.px]="rightWidth()"
    >
      <div class="flex items-center gap-2 border-b border-neutral-800 px-3 py-2 text-xs uppercase tracking-wide text-neutral-400">
        <ng-icon name="lucideBot" size="16" />
        Inspector / IA
      </div>
      <div class="flex-1 overflow-auto">
        <app-backend-status />
      </div>
    </aside>
  </div>

  <!-- Bottom panel: terminal -->
  <div
    class="h-1 shrink-0 cursor-row-resize bg-neutral-800 hover:bg-sky-500"
    (pointerdown)="startResize('bottom', $event)"
  ></div>

  <footer
    class="flex shrink-0 flex-col overflow-hidden border-t border-neutral-800 bg-neutral-900"
    [style.height.px]="bottomHeight()"
  >
    <div class="flex items-center gap-2 border-b border-neutral-800 px-3 py-2 text-xs uppercase tracking-wide text-neutral-400">
      <ng-icon name="lucideTerminal" size="16" />
      Terminal
    </div>
    <div class="flex-1 p-3 font-mono text-sm text-neutral-600">$ _</div>
  </footer>
</div>
